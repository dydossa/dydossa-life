<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>dydossa life</title>
<meta name="theme-color" content="#3A6EA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dydossa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://rheqsojhzktzkxilukhv.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<!-- sign in: a welcome screen with one user tile -->
<div class="logon" id="logon" hidden>
  <div class="lg-band top"></div>
  <div class="lg-mid">
    <div class="lg-brand"><span id="lg-emblem"></span><p><b>dydossa</b> <i>life</i></p></div>
    <div class="lg-split" aria-hidden="true"></div>
    <form class="lg-user" id="login-form" autocomplete="on">
      <span class="lg-tile" id="lg-tile"></span>
      <div class="lg-fields">
        <input type="email" id="l-email" class="fld" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="пошта" aria-label="Пошта" required>
        <div class="lg-pass">
          <input type="password" id="l-pass" class="fld" autocomplete="current-password" placeholder="пароль" aria-label="Пароль" required>
          <button type="submit" class="go" id="login-btn" aria-label="Увійти"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10.5h9V6l6.5 6-6.5 6v-4.5H5z"/></svg></button>
        </div>
        <p class="lg-err" id="login-err" role="alert" hidden></p>
      </div>
    </form>
  </div>
  <div class="lg-band bot"></div>
</div>

<!-- the app: a desktop, one window at a time, a taskbar -->
<div class="os" id="os" hidden>
  <main class="desk" id="desk"><div class="hits" id="hits"></div><div class="flower" id="flower"></div></main>

  <section class="win" id="win" hidden aria-labelledby="win-title">
    <header class="tb">
      <span class="tb-i" id="win-icon" aria-hidden="true"></span>
      <h1 class="tb-t" id="win-title"></h1>
      <button type="button" class="tb-b min" data-action="minimize" aria-label="Згорнути"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8.5h6v2H2z"/></svg></button>
      <button type="button" class="tb-b x" data-action="close-win" aria-label="Закрити"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 1l3.8 3.8L9.8 1 11 2.2 7.2 6 11 9.8 9.8 11 6 7.2 2.2 11 1 9.8 4.8 6 1 2.2z"/></svg></button>
    </header>
    <nav class="bar" id="win-bar" aria-label="Дії"></nav>
    <div class="pane" id="pane"></div>
    <footer class="sbar" id="win-status"></footer>
  </section>

  <div class="startm" id="startm" hidden>
    <div class="sm-head"><span class="sm-tile" id="sm-tile"></span><b>dydossa</b></div>
    <div class="sm-list" id="sm-list"></div>
    <div class="sm-foot">
      <button type="button" class="sm-f" data-action="theme" id="sm-theme"></button>
      <button type="button" class="sm-f" data-action="signout" id="sm-out" aria-label="Вийти"></button>
    </div>
  </div>

  <footer class="task" id="task">
    <button type="button" class="start" id="start-btn" data-action="start" aria-label="Меню" aria-expanded="false"></button>
    <div class="tasks" id="tasks"></div>
    <div class="tray">
      <button type="button" class="tray-b" id="tray-water" data-action="open" data-section="plants" hidden></button>
      <button type="button" class="tray-b" id="tray-theme" data-action="theme"></button>
      <time class="clock" id="clock"></time>
    </div>
  </footer>
</div>

<div class="modal" id="modal" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div></div>
<div class="balloon" id="toast" role="status" aria-live="polite" hidden></div>

<input type="file" id="f-cam" accept="image/*" capture="environment" hidden>
<input type="file" id="f-lib" accept="image/*" hidden>
<input type="file" id="f-files" multiple hidden>

<script src="../vendor/supabase.js"></script>
<script src="../config.js"></script>
<script src="icons.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
