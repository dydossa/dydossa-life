<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>dydossa life</title>
<meta name="theme-color" content="#3E7B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dydossa life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://rheqsojhzktzkxilukhv.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=59">
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"><div class="bg-glow g1"></div><div class="bg-glow g2"></div><div class="bg-stars" id="bg-stars"></div><span class="shoot"></span></div>

<!-- Sign-in screen -->
<div class="wrap auth" id="auth" hidden>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 29V15"/><path d="M16 17c-7 0-11-4-11-11 7 0 11 4 11 11z"/><path d="M16 21c0-5 3-9 10-9 0 6-3 9-10 9z"/></svg>
    <h1>dydossa <span>life</span></h1>
  </div>
  <form class="auth-card" id="login-form">
    <div class="field">
      <label for="l-email">Пошта</label>
      <input type="email" id="l-email" autocomplete="username" inputmode="email" autocapitalize="off" required>
    </div>
    <div class="field">
      <label for="l-pass">Пароль</label>
      <input type="password" id="l-pass" autocomplete="current-password" required>
    </div>
    <p class="auth-err" id="login-err" role="alert" hidden></p>
    <button type="submit" class="primary" id="login-btn">Увійти</button>
  </form>
</div>

<!-- The app -->
<div class="wrap" id="app" hidden>
  <header class="top">
    <button type="button" class="brand" data-action="home" aria-label="На головну">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 29V15"/><path d="M16 17c-7 0-11-4-11-11 7 0 11 4 11 11z"/><path d="M16 21c0-5 3-9 10-9 0 6-3 9-10 9z"/></svg>
      <h1>dydossa <span>life</span></h1>
    </button>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="trash-btn" data-action="trash-open" aria-label="Корзина" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        <span class="count" id="trash-count" hidden></span>
      </button>
      <button type="button" class="icon-btn" id="view-btn" data-action="home-view" hidden></button>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Перемкнути світлу і темну тему"></button>
    </div>
  </header>

  <!-- Home: a list of sections. Only "plants" exists so far. -->
  <section class="home" id="home">
    <div class="wheel-wrap" id="wheel"></div>
    <div class="hlist" id="hlist" hidden></div>
    <p class="wheel-name">dydossa life</p>
    <button type="button" class="home-edit" id="home-edit" data-action="home-edit" aria-pressed="false"></button>
  </section>

  <!-- Plants section -->
  <div class="section-screen" id="plants-screen" hidden>
    <header class="sec-hero p-hero" id="plants-hero">
      <span class="sec-hex" id="plants-hex" aria-hidden="true"></span>
      <div class="sec-text"><h2>Рослини</h2><p class="summary pstats" id="summary"></p></div>
      <div class="tabs ptabs" role="tablist" aria-label="Розділи">
        <button type="button" class="tab" role="tab" id="tab-plants" data-tab="plants" aria-selected="true" aria-label="Рослини" title="Рослини"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 3.5l4 2.3v4.6l-4 2.3-4-2.3V5.8z"/><path d="M16.5 3.5l4 2.3v4.6l-4 2.3-4-2.3V5.8z"/><path d="M12 11.6l4 2.3v4.6l-4 2.3-4-2.3v-4.6z"/></svg></button>
        <button type="button" class="tab" role="tab" id="tab-diary" data-tab="diary" aria-selected="false" aria-label="Щоденник" title="Щоденник"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"/><path d="M4 15l4.5-5 4 3L20 6"/><circle cx="8.5" cy="10" r="1.2" fill="currentColor"/><circle cx="12.5" cy="13" r="1.2" fill="currentColor"/></svg></button>
      </div>
    </header>

    <main id="view"><div class="loading">Завантаження…</div></main>
  </div>

  <!-- Dreams section -->
  <div class="section-screen" id="dreams-screen" hidden>
    <header class="sec-hero s-dreams" id="dreams-hero">
      <span class="sec-hex" id="dreams-hex" aria-hidden="true"></span>
      <div class="sec-text"><h2>Мрії</h2><p class="summary" id="dreams-summary"></p></div>
    </header>
    <main id="dreams-view"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <span class="sheet-icon" id="sheet-icon" aria-hidden="true"></span>
      <h2 id="sheet-title"></h2>
      <button type="button" class="ico" data-action="close" aria-label="Закрити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <form id="water-form" hidden>
      <div class="field">
        <label for="w-date">Дата поливу</label>
        <input type="date" id="w-date" required>
        <div class="day-chips" id="w-days">
          <button type="button" class="chip" data-action="w-day" data-d="0">Сьогодні</button>
          <button type="button" class="chip" data-action="w-day" data-d="1">Вчора</button>
          <button type="button" class="chip" data-action="w-day" data-d="2">2 дні тому</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">Фото</span>
        <div class="photo-pick">
          <button type="button" class="secondary desk-only" data-action="pick-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>Вибрати файл</button>
          <button type="button" class="secondary touch-only" data-action="pick-cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Зробити фото</button>
          <button type="button" class="secondary touch-only" data-action="pick-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>З галереї</button>
          <input type="file" id="w-cam" accept="image/*" capture="environment" hidden>
          <input type="file" id="w-lib" accept="image/*" hidden>
        </div>
        <img class="preview" id="w-preview" alt="Попередній перегляд фото" hidden>
        <button type="button" class="link-btn" id="w-clear" data-action="photo-clear" style="align-self:flex-start" hidden>Прибрати фото</button>
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="w-submit">Записати полив</button>
      </div>
    </form>

    <form id="plant-form" hidden>
      <div class="field">
        <label for="p-name">Назва</label>
        <input type="text" id="p-name" maxlength="60" required autocomplete="off">
      </div>
      <div class="field">
        <label for="p-interval">Поливати раз на скільки днів</label>
        <div class="stepper">
          <button type="button" class="step-btn" data-action="int-step" data-d="-1" aria-label="Менше">−</button>
          <input type="number" id="p-interval" min="1" max="365" inputmode="numeric" required>
          <button type="button" class="step-btn" data-action="int-step" data-d="1" aria-label="Більше">+</button>
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="p-submit">Зберегти</button>
        <button type="button" class="danger" id="p-delete" data-action="delete-plant" hidden>Видалити рослину</button>
      </div>
    </form>

    <div id="gallery" hidden></div>

    <form id="dream-form" hidden>
      <div class="field">
        <label for="d-title">Назва мрії</label>
        <input type="text" id="d-title" maxlength="80" required autocomplete="off" placeholder="Наприклад: поїхати в Японію">
      </div>
      <div class="field">
        <span class="lbl">Фото</span>
        <div class="photo-pick">
          <button type="button" class="secondary desk-only" data-action="d-pick-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>Вибрати файл</button>
          <button type="button" class="secondary touch-only" data-action="d-pick-cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Зробити фото</button>
          <button type="button" class="secondary touch-only" data-action="d-pick-lib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>З галереї</button>
          <input type="file" id="d-cam" accept="image/*" capture="environment" hidden>
          <input type="file" id="d-lib" accept="image/*" hidden>
        </div>
        <img class="preview" id="d-preview" alt="Попередній перегляд фото" hidden>
        <button type="button" class="link-btn" id="d-clear" data-action="d-photo-clear" style="align-self:flex-start" hidden>Прибрати фото</button>
      </div>
      <div class="field">
        <label for="d-why">Чому я цього хочу <span class="opt">(необов’язково)</span></label>
        <textarea id="d-why" maxlength="2000" rows="3" placeholder="Що це змінить, як я себе відчуватиму"></textarea>
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="d-submit">Зберегти</button>
      </div>
    </form>

    <div id="step-sheet" hidden></div>

    <input type="file" id="m-files" multiple hidden>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js?v=59"></script>
</body>
</html>
